<svg width="720" height="200" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="nox-mem — Hybrid memory with shadow discipline, yours by design">
  <title>nox-mem — Hybrid memory with shadow discipline</title>

  <!-- Background -->
  <rect width="720" height="200" fill="#0E0E10"/>

  <!-- Subtle grid texture -->
  <defs>
    <pattern id="grid-d" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E1E22" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="720" height="200" fill="url(#grid-d)"/>

  <!-- Graph visualization — right side, abstract memory graph -->
  <!-- Edges first (behind nodes) -->
  <line x1="520" y1="80" x2="580" y2="50" stroke="#2A2A2E" stroke-width="1.5"/>
  <line x1="520" y1="80" x2="580" y2="110" stroke="#2A2A2E" stroke-width="1.5"/>
  <line x1="520" y1="80" x2="460" y2="50" stroke="#2A2A2E" stroke-width="1.5"/>
  <line x1="520" y1="80" x2="460" y2="120" stroke="#2A2A2E" stroke-width="1.5"/>
  <line x1="520" y1="80" x2="550" y2="140" stroke="#2A2A2E" stroke-width="1.5"/>

  <!-- Secondary edges -->
  <line x1="580" y1="50" x2="630" y2="30" stroke="#222224" stroke-width="1"/>
  <line x1="580" y1="50" x2="640" y2="70" stroke="#222224" stroke-width="1"/>
  <line x1="580" y1="110" x2="650" y2="100" stroke="#222224" stroke-width="1"/>
  <line x1="580" y1="110" x2="640" y2="150" stroke="#222224" stroke-width="1"/>
  <line x1="460" y1="50" x2="420" y2="30" stroke="#222224" stroke-width="1"/>
  <line x1="460" y1="50" x2="410" y2="65" stroke="#222224" stroke-width="1"/>
  <line x1="460" y1="120" x2="410" y2="140" stroke="#222224" stroke-width="1"/>
  <line x1="550" y1="140" x2="590" y2="168" stroke="#222224" stroke-width="1"/>
  <line x1="550" y1="140" x2="510" y2="170" stroke="#222224" stroke-width="1"/>

  <!-- Cross-cluster accent edges -->
  <line x1="580" y1="50" x2="580" y2="110" stroke="#00C896" stroke-width="1" opacity="0.4"/>
  <line x1="460" y1="50" x2="460" y2="120" stroke="#00C896" stroke-width="1" opacity="0.25"/>

  <!-- Tertiary peripheral nodes -->
  <circle cx="630" cy="30" r="3" fill="none" stroke="#333336" stroke-width="1"/>
  <circle cx="640" cy="70" r="3" fill="none" stroke="#333336" stroke-width="1"/>
  <circle cx="650" cy="100" r="3" fill="none" stroke="#333336" stroke-width="1"/>
  <circle cx="640" cy="150" r="3" fill="none" stroke="#333336" stroke-width="1"/>
  <circle cx="420" cy="30" r="3" fill="none" stroke="#333336" stroke-width="1"/>
  <circle cx="410" cy="65" r="3" fill="none" stroke="#333336" stroke-width="1"/>
  <circle cx="410" cy="140" r="3" fill="none" stroke="#333336" stroke-width="1"/>
  <circle cx="590" cy="168" r="3" fill="none" stroke="#333336" stroke-width="1"/>
  <circle cx="510" cy="170" r="3" fill="none" stroke="#333336" stroke-width="1"/>

  <!-- Secondary cluster nodes -->
  <circle cx="580" cy="50" r="6" fill="#0E0E10" stroke="#444448" stroke-width="1.5"/>
  <circle cx="580" cy="110" r="6" fill="#0E0E10" stroke="#444448" stroke-width="1.5"/>
  <circle cx="460" cy="50" r="6" fill="#0E0E10" stroke="#444448" stroke-width="1.5"/>
  <circle cx="460" cy="120" r="6" fill="#0E0E10" stroke="#444448" stroke-width="1.5"/>
  <circle cx="550" cy="140" r="6" fill="#0E0E10" stroke="#444448" stroke-width="1.5"/>

  <!-- Primary center node — accent -->
  <circle cx="520" cy="80" r="10" fill="#0E0E10" stroke="#00C896" stroke-width="2"/>
  <circle cx="520" cy="80" r="4" fill="#00C896"/>

  <!-- Left side — wordmark + tagline -->
  <text x="48" y="82" fill="#EBEBEB" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="38" font-weight="600" letter-spacing="-1">nox-mem</text>

  <!-- Separator line -->
  <line x1="48" y1="98" x2="340" y2="98" stroke="#2A2A2E" stroke-width="1"/>

  <!-- Tagline -->
  <text x="48" y="126" fill="#EBEBEB" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="13" font-weight="300" letter-spacing="0.5">HYBRID MEMORY WITH SHADOW DISCIPLINE</text>
  <text x="48" y="148" fill="#00C896" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="13" font-weight="300" letter-spacing="0.5">&#x2014; YOURS BY DESIGN.</text>

  <!-- Bottom metadata -->
  <text x="48" y="182" fill="#3A3A3E" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" letter-spacing="1">SQLite &#xB7; FTS5 &#xB7; Gemini 3072d &#xB7; RRF &#xB7; KG &#xB7; Shadow-mode</text>
</svg>
