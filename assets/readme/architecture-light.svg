<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="nox-mem hybrid retrieval architecture diagram, light theme">
  <title>nox-mem — Hybrid Retrieval Architecture</title>

  <!-- Background -->
  <rect width="1000" height="600" fill="#F5F5F7"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="arch-grid-l" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#EAEAEC" stroke-width="0.5"/>
