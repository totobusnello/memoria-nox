<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">
<style>:root{--ink:#1a1a1a;--mut:#6b6b6b;--box:#c9c9c9;--brief:#b4472f;--busca:#2f6bb4;--cob:#7a9a4a;--fundo:#00000008}@media (prefers-color-scheme:dark){:root{--ink:#eaeaea;--mut:#9a9a9a;--box:#555;--brief:#e08a70;--busca:#79a9e0;--cob:#a8c47a;--fundo:#ffffff10}}text{fill:var(--ink)}.mut{fill:var(--mut)}.cx{fill:var(--fundo);stroke:var(--box);stroke-width:1.2;rx:6}</style>
<rect width="780" height="430" fill="transparent"/>
<text x="24" y="22" font-size="13" font-weight="600">Duas superfícies, dez slots: por onde um chunk pode chegar a um agente</text>
<rect class="cx" x="24" y="46" width="150" height="120"/>
<text x="99" y="72" text-anchor="middle" font-weight="600">corpus</text>
<text x="99" y="92" text-anchor="middle">67.187 chunks</text>
<text x="99" y="112" text-anchor="middle" class="mut" font-size="10">SQLite · FTS5</text>
<text x="99" y="127" text-anchor="middle" class="mut" font-size="10">vetores · grafo</text>
<text x="99" y="150" text-anchor="middle" class="mut" font-size="10">56.288 nunca expostos</text>
<rect class="cx" x="250" y="40" width="196" height="62"/>
<text x="348" y="60" text-anchor="middle" font-weight="600">pool principal</text>
<text x="348" y="78" text-anchor="middle" class="mut" font-size="10">ordenado por salience (soma aditiva)</text>
<text x="348" y="93" text-anchor="middle" font-size="10">→ 8 slots</text>
<rect class="cx" x="250" y="118" width="196" height="86" stroke="var(--cob)" stroke-width="2"/>
<text x="348" y="138" text-anchor="middle" font-weight="600" fill="var(--cob)">pool de cobertura</text>
<text x="348" y="157" text-anchor="middle" font-size="10">comparador LEXICOGRÁFICO</text>
<text x="348" y="172" text-anchor="middle" font-size="10">(last_served ASC, salience DESC)</text>
<text x="348" y="192" text-anchor="middle" font-size="10">→ até freshSlots = 2 slots</text>
<line x1="174" y1="106" x2="250" y2="71" stroke="var(--box)" stroke-width="1.2"/>
<line x1="174" y1="106" x2="250" y2="160" stroke="var(--box)" stroke-width="1.2"/>
<rect class="cx" x="522" y="40" width="234" height="164" stroke="var(--brief)" stroke-width="2"/>
<text x="639" y="60" text-anchor="middle" font-weight="600" fill="var(--brief)">superfície 1 — brief proativo</text>
<text x="639" y="78" text-anchor="middle" class="mut" font-size="10">/api/brief · 10 itens, sempre · o agente não pede</text>
<rect x="542" y="90" width="16" height="22" rx="2" stroke="var(--box)" fill="none" fill-opacity="0.25" stroke-width="1.4"/>
<rect x="563" y="90" width="16" height="22" rx="2" stroke="var(--box)" fill="none" fill-opacity="0.25" stroke-width="1.4"/>
<rect x="584" y="90" width="16" height="22" rx="2" stroke="var(--box)" fill="none" fill-opacity="0.25" stroke-width="1.4"/>
<rect x="605" y="90" width="16" height="22" rx="2" stroke="var(--box)" fill="none" fill-opacity="0.25" stroke-width="1.4"/>
<rect x="626" y="90" width="16" height="22" rx="2" stroke="var(--box)" fill="none" fill-opacity="0.25" stroke-width="1.4"/>
<rect x="647" y="90" width="16" height="22" rx="2" stroke="var(--box)" fill="none" fill-opacity="0.25" stroke-width="1.4"/>
<rect x="668" y="90" width="16" height="22" rx="2" stroke="var(--box)" fill="none" fill-opacity="0.25" stroke-width="1.4"/>
<rect x="689" y="90" width="16" height="22" rx="2" stroke="var(--box)" fill="none" fill-opacity="0.25" stroke-width="1.4"/>
<rect x="710" y="90" width="16" height="22" rx="2" stroke="var(--cob)" fill="var(--cob)" fill-opacity="0.25" stroke-width="1.4"/>
<rect x="731" y="90" width="16" height="22" rx="2" stroke="var(--cob)" fill="var(--cob)" fill-opacity="0.25" stroke-width="1.4"/>
<text x="639" y="130" text-anchor="middle" class="mut" font-size="10">os 2 verdes são o canal de cobertura</text>
<text x="639" y="152" text-anchor="middle" font-size="10">1.787 chunks já expostos aqui</text>
<text x="639" y="170" text-anchor="middle" class="mut" font-size="10">em 7 dias: 201 distintos em 46.295 slots</text>
<text x="639" y="188" text-anchor="middle" class="mut" font-size="10">top-10 = 47.2% dos slots</text>
<line x1="446" y1="122" x2="522" y2="122" stroke="var(--brief)" stroke-width="1.6"/>
<rect class="cx" x="522" y="226" width="234" height="86" stroke="var(--busca)" stroke-width="2"/>
<text x="639" y="246" text-anchor="middle" font-weight="600" fill="var(--busca)">superfície 2 — busca</text>
<text x="639" y="264" text-anchor="middle" class="mut" font-size="10">sob demanda · o agente decide procurar</text>
<text x="639" y="286" text-anchor="middle" font-size="10">9.755 chunks já expostos aqui</text>
<text x="639" y="304" text-anchor="middle" class="mut" font-size="10">híbrido: BM25 + semântico + RRF</text>
<line x1="174" y1="140" x2="380" y2="269" stroke="var(--busca)" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="380" y1="269" x2="522" y2="269" stroke="var(--busca)" stroke-width="1.6"/>
<rect class="cx" x="24" y="332" width="732" height="80"/>
<text x="40" y="354" font-weight="600">83.78% do corpus vivo nunca foi exposto: 56.288 de 67.187</text>
<text x="40" y="373" class="mut" font-size="10">1.787 (brief) + 9.755 (busca) − 491 (interseção) = 11.051 já expostos alguma vez. Não há terceira superfície: "nunca exposto" é ausência de registro nas duas, não inferência.</text>
<text x="40" y="389" class="mut" font-size="10">⚠️ 11.051 + 56.288 excede o corpus em 152: são chunks servidos e APAGADOS depois. Descontando-os, 10.899 + 56.288 = 67.187.</text>
<text x="40" y="405" class="mut" font-size="10">⚠️ Dos nunca expostos, 10.008 passam o piso de importância — elegíveis, e mesmo assim nunca chegaram.</text>
</svg>
