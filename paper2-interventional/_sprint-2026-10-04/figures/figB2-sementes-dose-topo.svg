<text x="326.2" y="76" font-size="10">design expectation 20×39/234 = 3.333 (dashed)</text>
<text x="326.2" y="90" font-size="10">conditional mean 3.357 (dotted) — the lines are 0.023 apart</text>
<text style="fill:var(--hi)" x="164.1" y="259.7" text-anchor="middle" font-size="10" font-weight="600" fill="var(--hi)">realized n = 1</text>
<text x="66" y="450" font-size="10.5">deficit −2.333 against the design = truncation +0.023 (−1.0% of it) + chance −2.357 (101.0% of it)</text>
<text x="66" y="466" class="mut" font-size="10">P(n = 1) = 10.15% · P(n ≤ 1) = 11.95% · mode 3 (25.3%) · with n = 1 there is no dose-response to read (spec §7)</text>
<text x="66" y="482" class="mut" font-size="10">Monte-Carlo s.e. of the conditional mean (2000 seeds) = 0.035; the truncation leg (+0.023) is 0.7 s.e.: its sign is not resolved</text>
