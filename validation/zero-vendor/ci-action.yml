name: Zero-Vendor Validation Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_mode:
        description: "Bind to a self-hosted VPS runner for live binary validation (optional)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Single job: runs ALL 8 zero-vendor checks on github-hosted ubuntu-latest.
  # CI mode uses the mock CLI (fixtures/mock-nox-mem.cjs); when NOX_MEM_DIR is
  # provided (e.g. on a self-hosted VPS runner), the checks transparently swap
  # in the real binary.
  # ---------------------------------------------------------------------------
  zero-vendor:
    name: "Zero-Vendor — all 8 checks"
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.live_mode == 'true') && fromJSON('["self-hosted","vps","nox-mem"]') || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install sqlite3 CLI
        run: |
          if command -v sqlite3 >/dev/null 2>&1; then
            echo "sqlite3 already present: $(sqlite3 --version)"
          else
            sudo apt-get update && sudo apt-get install -y sqlite3
          fi

      - name: Install tsx
        run: npm install -g tsx@4

      - name: Run zero-vendor suite (all 8 checks)
        id: runner
        run: |
          tsx validation/zero-vendor/runner.ts \
            --report /tmp/zero-vendor-report.json
        env:
          # On github-hosted runners NOX_MEM_DIR is absent → mock mode.
          # On self-hosted VPS runners set NOX_MEM_DIR=/root/.openclaw/workspace/tools/nox-mem
          # in the runner environment to flip to live mode.
          NOX_MEM_DIR: ${{ env.NOX_MEM_DIR || '' }}
          CI: "true"
        continue-on-error: true

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-vendor-report-${{ github.sha }}
          path: /tmp/zero-vendor-report.json
          retention-days: 30

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        run: |
          if [ -f /tmp/zero-vendor-report.json ]; then
            PASSED=$(jq -r '.passed' /tmp/zero-vendor-report.json)
            PASS_COUNT=$(jq -r '.summary.pass' /tmp/zero-vendor-report.json)
            FAIL_COUNT=$(jq -r '.summary.fail' /tmp/zero-vendor-report.json)
            DURATION=$(jq -r '.durationMs' /tmp/zero-vendor-report.json)

            if [ "$PASSED" = "true" ]; then
              ICON="✅"
              LABEL="ALL 8 CHECKS PASSED"
            else
              ICON="❌"
              LABEL="CHECKS FAILED"
            fi

            BODY="## Zero-Vendor Validation — $ICON $LABEL

          **Pillar A:** Hybrid memory with shadow discipline — yours by design.

          | Status | Count |
          |--------|-------|
          | ✓ Pass | $PASS_COUNT / 8 |
          | ✗ Fail | $FAIL_COUNT |

          Total runtime: ${DURATION}ms.
          All 8 checks run on github-hosted runners — no VPS dependency.

          <details>
          <summary>Full report</summary>

          \`\`\`json
          $(cat /tmp/zero-vendor-report.json | head -200)
          \`\`\`
          </details>"

            echo "$BODY" > /tmp/pr-comment.md
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/pr-comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert suite passed
        run: |
          if [ -f /tmp/zero-vendor-report.json ]; then
            PASSED=$(jq -r '.passed' /tmp/zero-vendor-report.json)
            FAIL_COUNT=$(jq -r '.summary.fail' /tmp/zero-vendor-report.json)
            if [ "$PASSED" != "true" ] || [ "$FAIL_COUNT" -gt "0" ]; then
              echo "Zero-vendor validation FAILED — $FAIL_COUNT check(s) failed."
              echo "A proprietary or unknown dependency may have been introduced."
              exit 1
            fi
            echo "Zero-vendor validation PASSED — all 8 checks green."
          else
            echo "Report file not found — runner may have crashed."
            exit 1
          fi
