<text x="290" y="39" font-size="14" font-weight="700" fill="#1b1f23">One SQLite file (WAL mode)</text>
<rect x="295" y="50" width="270" height="76" rx="6" fill="#ffffff" stroke="#3a4046" stroke-width="1.2"/>
<text x="305" y="69" font-size="13" font-weight="700" fill="#1b1f23">Chunks</text>
<text x="305" y="87" font-size="11" fill="#555b61">text, source file, type, dates,</text>
<text x="305" y="102" font-size="11" fill="#555b61">pain, retention window, section,</text>
<text x="305" y="117" font-size="11" fill="#555b61">importance, access count</text>
