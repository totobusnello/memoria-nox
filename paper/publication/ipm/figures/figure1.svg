<text x="305" y="155" font-size="13" font-weight="700" fill="#1b1f23">Lexical index (FTS5)</text>
<text x="305" y="173" font-size="11" fill="#555b61">BM25; accent folding, no stemming</text>
<rect x="295" y="190" width="270" height="44" rx="6" fill="#ffffff" stroke="#3a4046" stroke-width="1.2"/>
<text x="305" y="209" font-size="13" font-weight="700" fill="#1b1f23">Vector index (sqlite-vec)</text>
<text x="305" y="227" font-size="11" fill="#555b61">3072-d embeddings; exact search</text>
<rect x="295" y="244" width="270" height="60" rx="6" fill="#ffffff" stroke="#3a4046" stroke-width="1.2"/>
<text x="305" y="263" font-size="13" font-weight="700" fill="#1b1f23">Knowledge graph</text>
<text x="305" y="281" font-size="11" fill="#555b61">entities, typed relations with</text>
<text x="305" y="296" font-size="11" fill="#555b61">decaying confidence, evidence chunk</text>
<rect x="295" y="314" width="270" height="36" rx="6" fill="#ffffff" stroke="#3a4046" stroke-width="1.2"/>
<text x="305" y="333" font-size="11.5" font-weight="700" fill="#1b1f23">Audit table + pre-operation snapshot</text>
<line x1="230" y1="150" x2="278" y2="150" stroke="#3a4046" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="640" y="20" width="340" height="40" rx="6" fill="#f3f4f5" stroke="#3a4046" stroke-width="1.2"/>
