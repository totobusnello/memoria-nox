<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="560" viewBox="0 0 1024 560" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4046"/></marker></defs>
<rect width="1024" height="560" fill="#ffffff"/>
<rect x="20" y="20" width="210" height="58" rx="6" fill="#f3f4f5" stroke="#3a4046" stroke-width="1.2"/>
<text x="30" y="39" font-size="13" font-weight="700" fill="#1b1f23">Markdown and text files</text>
<text x="30" y="57" font-size="11" fill="#555b61">notes, decisions, entity files</text>
<rect x="20" y="112" width="210" height="74" rx="6" fill="#f3f4f5" stroke="#3a4046" stroke-width="1.2"/>
<text x="30" y="131" font-size="13" font-weight="700" fill="#1b1f23">Watcher and ingestion</text>
<text x="30" y="149" font-size="11" fill="#555b61">re-ingest 2 s after last write</text>
<text x="30" y="164" font-size="11" fill="#555b61">split by heading; type sets</text>
<text x="30" y="179" font-size="11" fill="#555b61">retention; entity sections</text>
<rect x="20" y="222" width="210" height="58" rx="6" fill="#f3f4f5" stroke="#3a4046" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="30" y="241" font-size="13" font-weight="700" fill="#1b1f23">Nightly LLM extraction</text>
<text x="30" y="259" font-size="11" fill="#555b61">daily notes → topic files</text>
