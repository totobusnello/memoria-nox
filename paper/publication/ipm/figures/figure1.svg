<rect x="640" y="84" width="160" height="76" rx="6" fill="#f3f4f5" stroke="#3a4046" stroke-width="1.2"/>
<text x="650" y="103" font-size="13" font-weight="700" fill="#1b1f23">Lexical layer</text>
<text x="650" y="121" font-size="11" fill="#555b61">BM25 over the FTS5 index</text>
<text x="650" y="136" font-size="11" fill="#555b61">(text, path, type)</text>
<text x="650" y="151" font-size="11" fill="#555b61">boosts summed (Σδ)</text>
<rect x="820" y="84" width="160" height="76" rx="6" fill="#f3f4f5" stroke="#3a4046" stroke-width="1.2"/>
<text x="830" y="103" font-size="13" font-weight="700" fill="#1b1f23">Dense layer</text>
<text x="830" y="121" font-size="11" fill="#555b61">exact L2 search over</text>
<text x="830" y="136" font-size="11" fill="#555b61">the sqlite-vec index</text>
<text x="830" y="151" font-size="11" fill="#555b61">boosts summed (Σδ)</text>
<rect x="640" y="186" width="340" height="44" rx="6" fill="#f3f4f5" stroke="#3a4046" stroke-width="1.2"/>
<text x="650" y="205" font-size="13" font-weight="700" fill="#1b1f23">Reciprocal Rank Fusion (k = 60)</text>
<text x="650" y="223" font-size="11" fill="#555b61">ranked chunks, each with chunk id and source file</text>
<rect x="640" y="252" width="340" height="58" rx="6" fill="#ffffff" stroke="#1f5f66" stroke-width="1.2"/>
<text x="650" y="271" font-size="13" font-weight="700" fill="#1b1f23">Salience delta, bounded to [−0.5, +0.5]</text>
<text x="650" y="289" font-size="11" fill="#555b61">0.55 importance + 0.15 recency + 0.10 pain + 0.20 access</text>
<text x="650" y="302" font-size="10.5" fill="#1f5f66">shadow: logged only · active: added to both layers’ boosts</text>
<line x1="720" y1="60" x2="720" y2="82" stroke="#3a4046" stroke-width="1.4" marker-end="url(#a)"/>
