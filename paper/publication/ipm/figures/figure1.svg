<text x="290" y="419" font-size="13" font-weight="700" fill="#1b1f23">Knowledge-graph path</text>
<text x="290" y="437" font-size="11" fill="#555b61">entity queries: SQL and regular</text>
<text x="290" y="452" font-size="11" fill="#555b61">expressions over relations; no model call</text>
<rect x="640" y="400" width="340" height="58" rx="6" fill="#f3f4f5" stroke="#3a4046" stroke-width="1.2"/>
<text x="650" y="419" font-size="13" font-weight="700" fill="#1b1f23">Session brief (read-only)</text>
<text x="650" y="437" font-size="11" fill="#555b61">top chunks by salience within a scope;</text>
<text x="650" y="452" font-size="11" fill="#555b61">does not update access counts</text>
