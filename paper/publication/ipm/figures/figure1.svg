<text x="30" y="519" font-size="13" font-weight="700" fill="#1b1f23">Interfaces: command line · HTTP API · Model Context Protocol server</text>
<text x="30" y="537" font-size="11" fill="#555b61">search (hybrid) · answer (8 chunks, inline citations, one retry if a citation falls outside them) · temporal filter (--as-of, --changed-since) as an SQL pre-filter</text>
