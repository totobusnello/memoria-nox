name: CodeQL

# DISABLED 2026-06-22: repo privado sem GitHub Advanced Security → code scanning
# indisponível; todo run termina em "configuration error" no upload do SARIF
# (job failure semanal + a cada push). Mantido como workflow_dispatch (manual) pra
# preservar a config. REATIVAR os triggers abaixo no go-live PÚBLICO do nox-mem
# (code scanning é grátis em repositório público).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   - cron: '0 4 * * 1'  # Weekly Monday 04:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
