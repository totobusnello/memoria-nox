name: Lint Docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        # Pinned to a commit 2026-10-27. `@v16` is a floating MAJOR tag, so a newer
        # markdownlint shipped MD060 and MD007 into it and turned the main branch
        # red on a push: 7,358 violations across files dating back to April, none
        # introduced by the commit that failed. A floating tag converts an upstream
        # release into a red build on unrelated work.
        uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8  # v16
        with:
          config: .markdownlint.yaml
          # Explicit canonical scope — bypass .markdownlintignore quirks
          globs: |
            docs/*.md
            docs/press-kit/**/*.md
            docs/research/*.md
            docs/discussions-seed/*.md
            docs/releases/*.md
            audits/*.md
            specs/*.md
            paper/abstract.md
            paper/refs-verification-log.md
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
        continue-on-error: false

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check internal links with lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --offline
            --exclude-path
            .lycheeignore
            README.md
            CONTRIBUTING.md
            docs/QUICKSTART.md
            docs/TUTORIAL.md
            docs/FAQ.md
            docs/ARCHITECTURE.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
